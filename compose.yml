services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        EXPO_PUBLIC_API_BASE_URL: http://localhost:3001
        EXPO_PUBLIC_MIN_SUPPORTED_API_VERSION: v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
